# Ruff Configuration for Intelligent Room Booking

target-version = "py311"
line-length = 120

[lint]
# Core rules: Error, Warning, Pyflakes, and Imports
select = ["E", "F", "W", "I"]
ignore = [
    "E501", # Line length (handled by formatter)
    "I001", # Unsorted imports (minor quality)
    "E402", # Module level import not at top (needed for Django settings/environ setup)
    "F401", # Unused imports
]

[lint.per-file-ignores]
"**/tests/*" = ["S101"]
"**/tests.py" = ["S101"]
"setup_dashboard.py" = ["T201"]
# Allow print in other tools
"dashboard_analytics.py" = ["T201"]
"debug.py" = ["T201"]
"debug2.py" = ["T201"]

[lint.mccabe]
max-complexity = 15

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

exclude = [
    ".git",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "migrations",
]
